[package]
name = "stellar-devkit"
version = "0.1.0"
edition = "2021"
description = "Developer toolkit for testing and simulating the Stellar fee tracker"

[[bin]]
name = "stellar-devkit"
path = "src/main.rs"

[lib]
name = "stellar_devkit"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }
