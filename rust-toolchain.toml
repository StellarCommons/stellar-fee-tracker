# Pin the Rust toolchain. Without this, every workflow followed the floating
# 'stable' channel, so a new Rust release could change `cargo clippy -D warnings`
# results without anything in the repository changing.
#
# Keep this in step with the toolchain passed to dtolnay/rust-toolchain in
# .github/workflows/*.yml and the Rust image in Dockerfile.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
