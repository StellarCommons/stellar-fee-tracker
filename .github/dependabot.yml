version: 2

updates:
  # Rust workspace (root) — packages/core and packages/devkit.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # wiremock is a dev-dependency of both core and devkit; bump them together.
      wiremock:
        patterns:
          - "wiremock"
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Pre-1.0 crates ship breaking changes as minor bumps, so both levels are
      # ignored until the migration is done deliberately.
      - dependency-name: "axum"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "tower-http"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Next.js dashboard.
  - package-ecosystem: npm
    directory: "/packages/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ui-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major upgrades of these need code changes; handle them by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]

  # actions/checkout, dtolnay/rust-toolchain, Swatinem/rust-cache, ...
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
