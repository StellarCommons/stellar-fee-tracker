name: Devkit CI

# Least privilege: every job in this workflow only reads the repository.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/devkit/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/devkit-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/devkit/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/devkit-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Mirrors rust-toolchain.toml (#984).
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check -p stellar-devkit
      - name: Run Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p stellar-devkit --all-targets -- -D warnings
      - uses: Swatinem/rust-cache@v2
      - name: Run Cargo Check
        run: cargo check -p stellar-devkit
      - name: Run Cargo Test
        run: cargo test -p stellar-devkit
