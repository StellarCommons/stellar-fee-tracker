name: Devkit CI

# Least privilege: every job in this workflow only reads the repository.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/devkit/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/devkit-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/devkit/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/devkit-ci.yml'

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Mirrors rust-toolchain.toml (#984).
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Run Cargo Check
        run: cargo check -p stellar-devkit
      - name: Run Cargo Test
        run: cargo test -p stellar-devkit
